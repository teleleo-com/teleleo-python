          type: object
      type: object
    RedirectionParams:
      description: |-
        What the redirection does. Required keys depend on redirection_type_id (400 PARAMS_NOT_VALID_EXCEPTION otherwise):
        - 1 (SMS) and 2 (call): at least one delivery target - a non-empty `email`, or at least one item in `emails` or `telegram_chat_ids`;
        - 3 (auto reply): `auto_reply_message`;
        - 4 (silent) and 5 (HTTP): `url`, an absolute URL.

        Other keys are stored as sent and returned as is.
      type: object
      properties:
        email:
          description: One e-mail address to deliver to (types 1 and 2).
          type: string
          example: ops@example.com
        emails:
          description: E-mail addresses to deliver to (types 1 and 2); each must be a valid address.
          type: array
          items:
            type: string
          example:
          - ops@example.com
        telegram_chat_ids:
          description: Telegram chat ids to deliver to (types 1 and 2); digits with an optional leading minus, as a string or a number.
          type: array
          items:
            type: string
          example:
          - '-1001234567890'
        auto_reply_message:
          description: Text of the reply SMS (type 3, required).
          type: string
          example: Thank you, we will call you back.
        forwarding_message:
          description: Optional text stored with the redirection.
          type: string
        url:
          description: URL that receives the event (types 4 and 5, required).
          type: string
          example: https://example.com/teleleo/sms
      additionalProperties: true
    RedirectionResponse:
      properties:
        data:
          $ref: '#/components/schemas/Redirection'
      type: object
    RedirectionTypeEnum:
      description: '1: Sms, 2: Call, 3: Auto reply, 4: Silent, 5: Http'
      type: integer
      enum:
      - 1
      - 2
      - 3
      - 4
      - 5
