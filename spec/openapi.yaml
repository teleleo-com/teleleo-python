openapi: 3.0.0
info:
  title: Teleleo Public API
  description: |
    Teleleo public API v1: the modem functions of the platform - SMS, calls, call scenarios, mailings, redirections, USSD, Wi-Fi, VPN, SOCKS proxy, SIP accounts of modems, contacts and files - for integrators.

    ## Authentication

    Every operation takes the user API key in the `auth-key` header. The key is shown and rotated in the cabinet (Settings - API key); it acts in the account of its owner, with every right of the owner. The key reaches the operations of this document only: any other operation of the platform answers `403` with `error_message` `PUBLIC_API_ROUTE_FORBIDDEN`, and `PUT /dongle/{dongle_id}` refuses the billing fields with `403 PUBLIC_API_FIELD_FORBIDDEN`. A missing or unknown key answers `401`. The `organization-id` header is not needed with an API key; a value that names another account answers `403` with `error_message` `ORGANIZATION_ACCESS_FORBIDDEN`. To check that a key works call `GET /dongle?is_short=1&limit=1`.

    ## Conventions

    - **Success** is HTTP 200 with the body `{"data": ...}`; the response schema of each operation describes the whole body.
    - **Errors** have one body for every operation, `ErrorResponseObject`: `{"is_successful": false, "code": <HTTP status>, "error_message": "<CODE>", "error_details": ["..."], "request_id": "..."}`. Act on `error_message`; `error_details` is human-readable text and may be empty; quote `request_id` to support. `x-error-codes` of an operation lists the `error_message` values specific to it; the ones below can come from any operation.
    - **Status codes**:
      - `400` - the request is invalid (`REQUEST_VALIDATION_EXCEPTION` and the codes of the operation), or an object it names is unknown or belongs to another account (an `error_message` with `NOT_FOUND`, for example `CONTACT_NOT_FOUND_EXCEPTION`; v1 answers 400, not 404, for a missing object);
      - `401` - the `auth-key` is missing or unknown, or the account is not active;
      - `403` - `PUBLIC_API_ROUTE_FORBIDDEN`: the request is outside the public API (for example another HTTP method on a public path), and the field refusals an operation names; `ORGANIZATION_ACCESS_FORBIDDEN`: the `organization-id` header names another account (see Authentication);
      - `404` - `ROUTE_NOT_FOUND`: the path is not an operation of the API (and the few operations that say so);
      - `405` - `METHOD_NOT_ALLOWED`: a known path with a method no operation of the platform has;
      - `409`, `429` - where an operation says so.

      A 5xx answer is a failure on the server, not an outcome of the contract: retry later and quote `request_id` if it persists.
    - **Pagination**: `page` is 0-based (minimum 0), `limit` is 1 to 1000 (50 when only `page` is sent); a value outside the range answers 400. `limit` alone returns the first page of that size. Without `page` and `limit` a list returns every item, except `GET /mailing`, which then returns the first 50. A paginated answer carries `total_count`.
    - **Sorting**: `order_by` (a camelCase attribute from the list of the operation) and `order` (`asc` or `desc`) go together; an unknown value of either answers 400. Without them every list is newest first: `created_at` descending, then the id descending.
    - **Arrays** in the query are sent repeated with square brackets: `dongle_ids[]=1&dongle_ids[]=2`.
    - **Dates**: a date filter in the query takes `YYYY-MM-DD HH:MM:SS` in UTC or an RFC 3339 date-time with an offset (`2026-11-09T12:42:00Z`, `2026-11-09T15:42:00+03:00`, fractional seconds allowed; percent-encode `+` as `%2B`); any other value answers 400 `PARSING_DATE_TIME_EXCEPTION`. A request body field takes `YYYY-MM-DD HH:MM:SS` in UTC as the field says. Dates in answers are `YYYY-MM-DD HH:MM:SS` with optional fractional seconds (`.ffffff`), in UTC, without an offset.
    - `x-served-by` on an operation names the backend that implements it; it changes nothing for the client.

    ## Versioning

    `info.version` follows semver. A patch release changes texts and examples only. A minor release is additive: a new operation, a new optional parameter or body field, a new response field, a new enum value (announced in the changelog - strict clients should tolerate unknown values). Anything that removes or renames an operation, a parameter or a field, changes a type or nullability, makes a request field required, drops a field from `required`, removes an enum value or changes the status or `error_message` of an existing outcome is a major release, announced in advance. An operation or field on its way out is marked `deprecated: true`; its removal is announced with an `x-sunset: YYYY-MM-DD` date at least three months ahead, and it is removed in a major release only. The changelog is [CHANGELOG.md](https://github.com/teleleo-com/teleleo-openapi/blob/main/CHANGELOG.md) in the teleleo-openapi repository.
