          example: '98349'
          nullable: true
        dongle_name:
          type: string
          example: Dongle1
          description: Name of the modem. Returned by GET /sms and GET /dongle/{dongle_id}/sms only.
        replied_to_sms_id:
          type: integer
          example: 2
          nullable: true
        mailing_history_id:
          type: integer
          description: The mailing run that sent this SMS; null for an SMS outside a mailing.
          example: 67
          nullable: true
        contact:
          allOf:
          - $ref: '#/components/schemas/Contact'
          description: The contact whose phone is the other party of the SMS. Returned by GET /sms and GET /dongle/{dongle_id}/sms only, and only when there is such a contact (the key is absent otherwise).
        replied_from_sms:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Sms'
          description: The reply sent to this SMS (the SMS whose replied_to_sms_id is this sms_id), null when there is none; without its own redirections, replied_from_sms, contact and dongle_name. Returned by GET /sms, GET /dongle/{dongle_id}/sms, GET /dongle/{dongle_id}/sms/{sms_id} and PUT /dongle/{dongle_id}/sms/{sms_id}; absent in the answers of the sending operations.
        redirections:
          type: array
          items:
            $ref: '#/components/schemas/Redirection'
          description: Redirection rules that fired on this SMS. Returned by GET /sms, GET /dongle/{dongle_id}/sms, GET /dongle/{dongle_id}/sms/{sms_id} and PUT /dongle/{dongle_id}/sms/{sms_id}; absent in the answers of the sending operations.
      type: object
    SmsListResponse:
      properties:
        data:
          properties:
            total_count:
              type: integer
            smses:
              type: array
              items:
                $ref: '#/components/schemas/Sms'
          type: object
      type: object
    SmsPdu:
      required:
      - pdu
      properties:
        pdu:
          description: PDU in hex.
          type: string
        length:
          type: integer
          description: Present on SMS received before 2024-04.
        time:
          type: integer
          description: Unix time; present on SMS received before 2024-04.
      type: object
    SmsResponse:
      properties:
        data:
          $ref: '#/components/schemas/Sms'
      type: object
    SmsSourceType:
      description: '1: Local, 2: International, 3: Short (short code or alphanumeric sender)'
      type: integer
      enum:
      - 1
      - 2
      - 3
      example: 1
    SmsStatus:
      description: '1: Sended - accepted by the mobile network (about a second after creation), not delivered to the handset; 2: Received (incoming); 3: Not received - the network refused it; 4: Created; 5: Enqueued; 6: Canceled; 7: Incoming incomplete - not every part of a multipart SMS arrived'
      type: integer
      enum:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      example: 1
    SmsThread:
      type: object
      required:
      - dongle_id
      - contact_number
      - last_message
      properties:
        dongle_id:
          type: integer
        contact_number:
          type: string
        last_message:
          $ref: '#/components/schemas/SmsThreadLastMessage'
    SmsThreadLastMessage:
      type: object
      required:
      - sms_id
      - preview
      - created_at
      - is_incoming
      - sms_status_id
      properties:
        sms_id:
          type: integer
        preview:
          type: string
        created_at:
          type: string
          description: UTC, `YYYY-MM-DD HH:MM:SS[.ffffff]`.
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(\.\d{1,6})?$
        is_incoming:
          type: boolean
        sms_status_id:
          type: integer
    SmsThreadListResponse:
      required:
      - data
      properties:
        data:
          type: object
          required:
          - total_count
          - sms_threads
          properties:
            total_count:
              type: integer
            sms_threads:
              type: array
              items:
                $ref: '#/components/schemas/SmsThread'
      type: object
    SmsType:
      description: '1: Outgoing, 2: Incoming, 3: Auto reply, 4: Reply, 5: Delayed (scheduled), 6: Mailing, 7: Silent'
      type: integer
      enum:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      example: 1
    StatusResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - status
          properties:
            status:
              type: boolean
              example: true
    TmpFileResponse:
      required:
      - data
      properties:
        data:
          required:
          - tmp_file_id
          properties:
            tmp_file_id:
              description: 'Temporary file id: `<2 hex>/<32 hex>/<file name>` (three segments with slashes). Read it with GET /file/tmp/{file_id}, attach it through tmp_file_id of a call scenario or a call mailing.'
              type: string
              pattern: ^[0-9a-f]{2}/[0-9a-f]{32}/[^/]+$
              example: 4f/4f5d6e7a8b9c0d1e2f3a4b5c6d7e8f90/voice.wav
          type: object
      type: object
    UpdateCallScenarioRequest:
      properties:
        name:
          type: string
        is_call_record:
          type: boolean
        call_scenario_type_id:
          type: integer
        tmp_file_id:
          description: 'Temporary audio file: tmp_file_id returned by POST /file/upload-tmp or POST /file/generate-speech, `<2 hex>/<32 hex>/<file name>`.'
          type: string
        call_scenario_contact_ids:
          type: array
          items:
            type: integer
        call_scenario_phones:
          type: array
          items:
            type: string
            format: phone
        call_scenario_contact_group_ids:
          type: array
          items:
            type: integer
        version_uuid:
          description: Version of the scenario the client edited; a different current version answers 409
          type: string
          format: uuid
      type: object
      example:
        name: name
        call_scenario_type_id: 1
        is_call_record: true
        tmp_file_id: 4f/4f5d6e7a8b9c0d1e2f3a4b5c6d7e8f90/voice.wav
        call_scenario_contact_ids:
        - 1
        - 2
        - 3
        call_scenario_phones:
        - '+79032432448'
        - '+79234155439'
        call_scenario_contact_group_ids:
        - 1
        version_uuid: 3f2b8c1e-7d4a-4c1b-9e2f-5a6b7c8d9e0f
    UpdateContactGroupRequest:
      required:
      - name
      - contact_ids
      properties:
        name:
          type: string
        contact_ids:
          description: Contacts of the group; send an empty array for none. Replaces the current set on update.
          type: array
          items:
            type: integer
      type: object
      example:
        name: name
        contact_ids:
        - 1
    UpdateContactRequest:
      required:
      - phone
      - name
      - contact_group_ids
      properties:
        phone:
          type: string
        name:
          description: Name of the contact; the key is required, the value may be null.
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        contact_group_ids:
          description: Groups of the contact; send an empty array for none. Replaces the current set on update.
          type: array
          items:
            type: integer
      type: object
      example:
        phone: '+74392686423468'
        name: name
        email: contact@example.com
        contact_group_ids:
        - 1
    UpdateDongleOfflineNotificationRequest:
      properties:
        is_enabled:
          type: boolean
          description: Enable (true) or disable (false) email when the modem goes offline
      required:
      - is_enabled
      type: object
    UpdateDongleRequest:
      properties:
        name:
          description: Display name of the modem.
          type: string
        number:
          description: 'Phone number of the SIM in international format. Omit the field to keep the current number: null does not clear it.'
          type: string
        is_mute_incoming_call:
          description: Reject incoming calls on the modem.
          type: boolean
        dongle_call_type_id:
          description: 'How incoming calls are handled: 1 - SIP (softphone), 2 - call scenario.'
          type: integer
      type: object
      example:
        name: dongle_1
        number: '+447700900123'
        is_mute_incoming_call: false
        dongle_call_type_id: 1
    UpdateDongleSocksProxyRequest:
      required:
      - password
      - allowed_ips
      properties:
        password:
          type: string
        allowed_ips:
          description: Client IP addresses allowed to connect; an empty list allows any address. Replaces the list as a whole.
          type: array
          items:
            type: string
      type: object
      example:
        password: e5f6g7h8
        allowed_ips:
        - 192.168.1.1
        - 10.0.0.1
    UpdateFollowUpSmsSettingRequest:
      required:
      - dongle_id
      - name
      - text
      properties:
        dongle_id:
          type: integer
        name:
          type: string
        text:
          type: string
        ringing_duration_timeout:
          type: integer
          nullable: true
        call_duration_timeout:
          type: integer
          nullable: true
        daily_sms_limit:
          type: integer
          nullable: true
      type: object
      example:
        dongle_id: 1
        name: Follow-up SMS
        text: Thank you for your call
        ringing_duration_timeout: 10
        call_duration_timeout: 30
        daily_sms_limit: 100
    UpdateMailingRequest:
      properties:
        name:
          type: string
          nullable: true
        text:
          type: string
          nullable: true
        mailing_type_id:
          type: integer
          nullable: true
          enum:
          - 1
          - 2
          description: '1: Simple (sent at once), 2: Delayed (sent at scheduled_at).'
        mailing_status_id:
          type: integer
          nullable: true
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          description: '1: Draft, 2: Planned, 3: In process, 4: Ended, 5: Canceled.'
        scheduled_at:
          type: string
          nullable: true
        is_deleted:
          type: boolean
          nullable: true
        tmp_file_id:
          description: 'Temporary audio file: tmp_file_id returned by POST /file/upload-tmp or POST /file/generate-speech, `<2 hex>/<32 hex>/<file name>`. Used by a call mailing.'
          type: string
          nullable: true
        mailing_phones:
          type: array
          items:
            type: string
        mailing_contact_ids:
          type: array
          items:
            type: integer
        mailing_contact_group_ids:
          type: array
          items:
            type: integer
      type: object
      example:
        name: name
        mailing_type_id: 1
        mailing_status_id: 1
        scheduled_at: '2023-01-01 11:11:11'
        text: text
        mailing_phones:
        - '+7905123213'
        - '+7904234324'
        mailing_contact_ids:
        - 1
        - 2
        mailing_contact_group_ids:
        - 1
        - 2
    UpdateRedirectionRequest:
      required:
      - redirection_type_id
      - name
      - condition
      - params
      properties:
        condition:
          $ref: '#/components/schemas/RedirectionCondition'
        name:
          type: string
        params:
          $ref: '#/components/schemas/RedirectionParams'
        redirection_type_id:
          $ref: '#/components/schemas/RedirectionTypeEnum'
      type: object
      example:
        condition:
        - and
        - - in
          - dongle_dongle_id
          - - 1
        - - in
          - sms_number_caller
          - - '+447700900123'
        name: SMS from the bank
        params:
          emails:
          - ops@example.com
          telegram_chat_ids:
          - '-1001234567890'
        redirection_type_id: 1
    UpdateSmsRequest:
      properties:
        number:
          type: string
        message:
          type: string
        contact_id:
          type: integer
        dongle_id:
          type: integer
        scheduled_at:
          type: string
          nullable: true
      type: object
      example:
        number: '74392686423468'
        message: message
        scheduled_at: '2023-01-01 11:11:11'
        contact_id: 1
        dongle_id: 1
    UploadTmpFileRequest:
      required:
      - file_base64
      - file_name
      - scenario
      properties:
        file_base64:
          description: Content of the audio file, base64-encoded.
          type: string
          format: base64
        file_name:
          description: Name of the file; it becomes the last segment of tmp_file_id.
          type: string
        scenario:
          description: 'The only upload scenario: the audio is converted to the modem format (wav) and stored as a temporary file.'
          type: string
          enum:
          - SCENARIO_CONVERT_TO_DONGLE_AUDIO_AND_UPLOAD_TMP
      type: object
      example:
        file_base64: UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAABCxAgAEABAAZGF0YQAAAAA=
        file_name: voice.wav
        scenario: SCENARIO_CONVERT_TO_DONGLE_AUDIO_AND_UPLOAD_TMP
    Ussd:
      properties:
        ussd_id:
          type: integer
          example: 12345
        dongle_id:
          type: integer
          example: 6789
        ussd_status_id:
          $ref: '#/components/schemas/UssdStatus'
        ussd_type_id:
          $ref: '#/components/schemas/UssdType'
        command:
          type: string
          example: '*102#'
          nullable: true
        response:
          type: string
          example: response
          nullable: true
        external_id:
          type: string
          example: external_id
          nullable: true
        raw_webhook_data:
          type: object
          nullable: true
        created_at:
          type: string
          description: UTC, `YYYY-MM-DD HH:MM:SS[.ffffff]`.
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(\.\d{1,6})?$
          example: '2023-12-05 08:30:00'
        updated_at:
          type: string
          description: UTC, `YYYY-MM-DD HH:MM:SS[.ffffff]`.
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(\.\d{1,6})?$
          example: '2023-12-05 08:35:00'
      type: object
    UssdListResponse:
      properties:
        data:
          properties:
            total_count:
              type: integer
            ussds:
              type: array
              items:
                $ref: '#/components/schemas/Ussd'
          type: object
      type: object
    UssdResponse:
      properties:
        data:
          $ref: '#/components/schemas/Ussd'
      type: object
    UssdStatus:
      description: '1: Created, 2: Sending, 3: Success, 4: Error'
      type: integer
      enum:
      - 1
      - 2
      - 3
      - 4
      example: 1
    UssdType:
      description: '1: Incoming, 2: Outgoing'
      type: integer
      enum:
      - 1
      - 2
      example: 1
  responses:
    BadRequest:
      description: 'Bad request: the request is invalid, an object it names is unknown or belongs to another account (an error_message with NOT_FOUND), or the operation refused the current state; x-error-codes lists the error_message values.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseObject'
    Unauthorized:
      description: 'Unauthorized: the auth-key is missing or unknown, or the account is not active.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseObject'
    Forbidden:
      description: 'Forbidden: PUBLIC_API_ROUTE_FORBIDDEN, the request is outside the public API (for example another HTTP method on this path).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseObject'
  securitySchemes:
    auth-key:
      type: apiKey
      in: header
      name: auth-key
      description: The user API key from the cabinet. Acts in the account of its owner with every right of the owner; reaches the operations of this document only.
tags:
- name: Call
  description: 'Calls of the modems: history, outgoing calls.'
- name: Contact
  description: Address book of the account.
- name: ContactGroup
  description: Groups of contacts, used by mailings, call scenarios and redirections.
- name: Dongle
  description: 'Modems of the account and their commands: reboot, Wi-Fi, Wi-Fi extender, number, network info.'
- name: Mailing
  description: Bulk SMS and call campaigns.
- name: Redirection
  description: 'Rules for incoming SMS and calls: forwarding, auto reply, HTTP callback.'
- name: Ussd
  description: USSD requests through a modem.
- name: Sms
  description: 'SMS of the modems: history, sending, replies, threads.'
- name: CallScenario
  description: What a modem plays to incoming callers.
- name: FollowUpSms
  description: SMS a modem sends to a caller after a call.
- name: PublicVpn
  description: VPN access through a modem.
- name: DongleSocksProxy
  description: SOCKS5 proxy through the mobile network of a modem.
- name: File
  description: Downloads, temporary audio uploads and text-to-speech.
- name: Sip
  description: SIP accounts of the modems.
