    Dongle:
      required:
      - dongle_id
      - bootstrap_dongle_id
      - user_id
      - name
      - is_hotspot_enable
      - hotspot_name
      - hotspot_password
      - number
      - is_deleted
      - created_at
      - updated_at
      - tariff_package_id
      - tariff_package_end
      - imsi
      - iccid
      - is_active
      - mcc
      - activated_at
      - daily_sms_limit
      - is_tariff_package_active
      - is_tariff_package_enabled
      - dongle_signal_quality_id
      - is_send_report
      - dongle_call_type_id
      - is_public_vpn_enabled
      - public_vpn_login
      - public_vpn_password
      - is_mute_incoming_call
      - is_trial
      - trial_end
      - last_online_at
      - dongle_online_error_code_id
      properties:
        dongle_id:
          type: integer
          example: 12345
        bootstrap_dongle_id:
          type: integer
          example: 12345
        user_id:
          type: integer
          example: 12345
        name:
          type: string
          example: '1234567890'
        is_hotspot_enable:
          type: boolean
          example: true
          nullable: true
        hotspot_name:
          type: string
          example: name
          nullable: true
        hotspot_password:
          description: Password of the Wi-Fi hotspot of the modem.
          type: string
          example: password
          nullable: true
        number:
          type: string
          example: '+79043543452'
          nullable: true
        is_deleted:
          type: boolean
          example: true
        created_at:
          type: string
          description: UTC, `YYYY-MM-DD HH:MM:SS[.ffffff]`.
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(\.\d{1,6})?$
          example: '2023-12-05 08:30:00'
        updated_at:
          type: string
          description: UTC, `YYYY-MM-DD HH:MM:SS[.ffffff]`.
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(\.\d{1,6})?$
          example: '2023-12-05 08:35:00'
        tariff_package_id:
          type: integer
          example: 12345
          nullable: true
        tariff_package_end:
          type: string
          description: UTC, `YYYY-MM-DD HH:MM:SS[.ffffff]`.
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(\.\d{1,6})?$
          example: '2023-12-05 08:35:00'
          nullable: true
        imsi:
          type: string
          example: '5435435'
          nullable: true
        iccid:
          type: string
          example: '54553453'
          nullable: true
        is_active:
          type: boolean
          example: true
        mcc:
          type: string
          example: '54553453'
          nullable: true
        activated_at:
          type: string
          description: UTC, `YYYY-MM-DD HH:MM:SS[.ffffff]`.
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(\.\d{1,6})?$
          example: '2023-12-05 08:35:00'
          nullable: true
        daily_sms_limit:
          type: integer
          example: 12345
          nullable: true
        is_tariff_package_active:
          type: boolean
          example: true
        is_tariff_package_enabled:
          type: boolean
          example: true
        dongle_signal_quality_id:
          type: integer
          nullable: true
          enum:
          - 1
          - 2
          - 3
          description: '1: Bad, 2: Medium, 3: Good. Null when not set.'
        is_send_report:
          type: boolean
          example: true
        dongle_call_type_id:
          type: integer
          example: 12345
        is_public_vpn_enabled:
          type: boolean
          example: true
        public_vpn_login:
          description: IKEv2 login for public_vpn_server.
          type: string
          example: vpn4a1b2c3d
          nullable: true
        public_vpn_password:
          description: IKEv2 password for public_vpn_server; POST /dongle/{dongle_id}/public-vpn/refresh-password replaces it and the new value is read here.
          type: string
          example: Qm9vdHN0cmFw
          nullable: true
        is_mute_incoming_call:
          type: boolean
          example: true
        is_trial:
          type: boolean
          example: true
        trial_end:
          type: string
          description: UTC, `YYYY-MM-DD HH:MM:SS[.ffffff]`.
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(\.\d{1,6})?$
          example: '2023-12-05 08:35:00'
          nullable: true
        dongle_online_error_code_id:
          type: integer
          nullable: true
          enum:
          - 1
          - 2
          - 3
          - 4
          example: 1
          description: '1: Phone determination error, 2: Timeout error, 3: Unexpected error, 4: Health check failed error. Null when not set.'
        last_online_at:
          type: string
          description: UTC, `YYYY-MM-DD HH:MM:SS[.ffffff]`.
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(\.\d{1,6})?$
          example: '2023-12-05 08:35:00'
          nullable: true
        wifi_extender_ssid:
          description: Network name of the Wi-Fi extender.
          type: string
          example: extender_ssid
          nullable: true
        wifi_extender_password:
          description: Password of the Wi-Fi extender network.
          type: string
          example: extender_password
          nullable: true
        wifi_extender_mode:
          description: Wi-Fi extender mode of the modem. Returned by the operations served by backend-api (GET /dongle, the nested dongle of mailings); the operations served by backend return the same value as dongle_wifi_extender_mode_id.
          type: integer
          example: 1
          nullable: true
        dongle_wifi_extender_mode_id:
          description: Wi-Fi extender mode of the modem as GET /dongle/{dongle_id} and PUT /dongle/{dongle_id} return it (the column name); the operations served by backend-api return it as wifi_extender_mode.
          type: integer
          example: 1
          nullable: true
        dialplan_id:
          description: FreeSWITCH dialplan of the modem.
          type: integer
          example: 3
        is_wifi_extender_processing:
          type: boolean
          description: True while a wifi extender enable/disable command is being processed by the modem.
          example: false
        dongle_setting:
          description: 'Per-modem settings the client may see. Returned by GET /dongle only, and only in full mode: absent - not null - in is_short mode and when the modem has no settings.'
          properties:
            is_offline_notification_enabled:
              description: Email the owner when the modem goes offline. Written via PUT /dongle/{dongle_id}/setting/offline-notification.
              type: boolean
              example: true
          type: object
        public_vpn_endpoint:
          description: Use public_vpn_server.address. Returned by GET /dongle only, in full mode.
          type: string
          example: gw.teleleo.com
          nullable: true
          deprecated: true
        public_vpn_server:
          description: 'VPN gateway the client connects to with public_vpn_login and public_vpn_password, the same for every dongle. Returned by GET /dongle only, and only in full mode: absent - not null - in is_short mode.'
          required:
          - type
          - address
          - remote_id
          properties:
            type:
              type: string
              enum:
              - IKEv2
              example: IKEv2
            address:
              type: string
              example: gw.teleleo.com
            remote_id:
              description: 'IKEv2 Remote ID: the identity the gateway presents.'
              type: string
              example: gw.teleleo.com
          type: object
        dongle_online_status:
          $ref: '#/components/schemas/DongleOnlineStatusEnum'
        sms_outgoing:
          type: integer
          description: Number of outgoing SMS of the modem. Returned by GET /dongle/{dongle_id} and PUT /dongle/{dongle_id} only.
          example: 12
        sms_incoming:
          type: integer
          description: Number of incoming SMS of the modem. Returned by GET /dongle/{dongle_id} and PUT /dongle/{dongle_id} only.
          example: 30
        call_outgoing:
          type: integer
          description: Number of outgoing calls of the modem. Returned by GET /dongle/{dongle_id} and PUT /dongle/{dongle_id} only.
          example: 3
        call_incoming:
          type: integer
          description: Number of incoming calls of the modem. Returned by GET /dongle/{dongle_id} and PUT /dongle/{dongle_id} only.
          example: 5
        bootstrap_dongle:
          type: object
          description: Hardware identity of the modem. Returned by GET /dongle/{dongle_id} and PUT /dongle/{dongle_id} only.
          properties:
            imei_manufacture:
              type: string
              nullable: true
              description: IMEI as manufactured.
              example: '356938035643809'
            pbx_sip_user:
              type: string
              nullable: true
              description: SIP login of the modem on the PBX.
              example: '1001'
      type: object
      description: A modem. GET /dongle/{dongle_id} and PUT /dongle/{dongle_id} return every attribute plus the counters and bootstrap_dongle; GET /dongle returns the attributes and, in full mode, dongle_setting and public_vpn_server.
