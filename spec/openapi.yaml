  /dongle:
    get:
      tags:
      - Dongle
      summary: List modems
      operationId: listDongles
      description: 'Modems of the account. In full mode every field of the Dongle schema that the list serves is returned; dongle_setting and public_vpn_server are present in full mode only. The cheapest call is GET /dongle?is_short=1&limit=1: use it to check that an API key works. Newest first by default (created_at descending, then the id descending).'
      security:
      - auth-key: []
      x-served-by: backend-api
      parameters:
      - name: page
        in: query
        description: Page number, 0-based.
        schema:
          type: integer
          minimum: 0
        example: 0
      - name: limit
        in: query
        description: Number of items per page, 1 to 1000.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
        example: 10
      - name: dongle_ids[]
        in: query
        description: Array of integers representing dongle IDs
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
      - name: order_by
        in: query
        description: 'Attribute to sort by, sent together with order. One of: dongleId, name, number, createdAt, updatedAt, activatedAt, lastOnlineAt, isActive, isTariffPackageActive, tariffPackageEnd, recentOutgoingSmsCount, recentOutgoingCallCount.'
        schema:
          type: string
        example: createdAt
      - name: order
        in: query
        description: 'Sort direction, sent together with order_by. Without order_by and order the list is newest first: created_at descending, then the id descending.'
        schema:
          type: string
          enum:
          - asc
          - desc
        example: desc
      - name: is_active
        in: query
        description: Filter by dongle active flag
        schema:
          type: boolean
      - name: is_short
        in: query
        description: 'Short mode: only dongle_id, name, number, is_trial, is_tariff_package_active, dongle_online_status, dongle_online_error_code_id, dongle_call_type_id and is_wifi_extender_processing per modem; the cheapest call, also fit to check that the key works.'
        schema:
          type: boolean
