[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "teleleo"
version = "0.1.0"
description = "The official Python library for the Teleleo API: SMS, calls, USSD and modem control"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Teleleo", email = "support@teleleo.com" }]
keywords = ["teleleo", "sms", "sms api", "gsm modem", "sim", "ussd", "calls", "socks proxy", "vpn", "api client", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Telephony",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.23.0,<1",
  "pydantic>=2.0,<3",
  "typing-extensions>=4.7",
]

[project.urls]
Homepage = "https://teleleo.com"
Documentation = "https://github.com/teleleo-com/teleleo-python#readme"
Repository = "https://github.com/teleleo-com/teleleo-python"
Changelog = "https://github.com/teleleo-com/teleleo-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/teleleo-com/teleleo-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/teleleo"]

[tool.hatch.build.targets.sdist]
include = ["src/teleleo", "README.md", "LICENSE", "CHANGELOG.md", "api.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B008"]

[tool.ruff.lint.per-file-ignores]
"src/teleleo/resources/*.py" = ["E501"]
"src/teleleo/types/*.py" = ["E501"]
"tests/test_operations_generated.py" = ["E501"]
"scripts/*.py" = ["E501", "B007"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]
